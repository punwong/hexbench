<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>快捷语</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f7f7f8;
        --surface-2: #efeff1;
        --surface-3: #e6e6e9;
        --text: #0d0d0d;
        --muted: #6b6b6b;
        --accent: #0d0d0d;
        --on-accent: #ffffff;
        --danger: #d92d20;
        --ok: #10a37f;
        --ease: cubic-bezier(0.2, 0, 0, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --surface: #191919;
          --surface-2: #232323;
          --surface-3: #2c2c2c;
          --text: #ececec;
          --muted: #9b9b9b;
          --accent: #ececec;
          --on-accent: #0d0d0d;
          --danger: #ff6b6b;
          --ok: #3ddc97;
        }
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #root {
        height: 100%;
      }

      .panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--bg);
        border: none;
        border-radius: 14px;
        overflow: hidden;
        box-sizing: border-box;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.14);
        animation: panel-in 180ms var(--ease) both;
      }

      @keyframes panel-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 8px 14px;
        background: transparent;
        border: none;
        font-size: 12px;
        color: var(--muted);
        cursor: grab;
        user-select: none;
      }

      .head-logo {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin-right: 8px;
        padding: 0;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 160ms var(--ease);
      }

      .head-logo:hover {
        background: var(--surface);
      }

      .head-title {
        margin-right: auto;
        font-weight: 600;
        color: var(--text);
      }

      .head-actions {
        display: flex;
        gap: 2px;
      }

      .icon {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        width: 26px;
        height: 24px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 160ms var(--ease),
          color 160ms var(--ease);
      }

      .icon:hover {
        background: var(--surface);
        color: var(--text);
      }

      .icon.active {
        background: var(--accent);
        color: var(--on-accent);
      }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .item {
        text-align: left;
        border: none;
        background: var(--surface);
        border-radius: 10px;
        padding: 9px 11px;
        cursor: pointer;
        font: inherit;
        color: inherit;
        transition: background-color 160ms var(--ease);
      }

      .item:hover {
        background: var(--surface-2);
      }

      .item:active {
        background: var(--surface-3);
      }

      .item .title {
        display: block;
        font-weight: 600;
        font-size: 13px;
      }

      .item .preview {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .edit-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: var(--surface);
      }

      .edit-item input,
      .edit-item textarea {
        font: inherit;
        font-size: 12.5px;
        color: var(--text);
        background: var(--bg);
        border: none;
        border-radius: 8px;
        padding: 7px 9px;
        outline: none;
        resize: vertical;
        transition: background-color 160ms var(--ease);
      }

      .edit-item input:focus,
      .edit-item textarea:focus {
        background: var(--surface-2);
      }

      .edit-item .del {
        align-self: flex-end;
        border: none;
        background: transparent;
        color: var(--danger);
        font-size: 11.5px;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }

      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 16px 12px;
        line-height: 1.7;
      }

      .panel.collapsed {
        background: transparent;
        box-shadow: none;
        border-radius: 50%;
      }

      .bubble {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        background: var(--bg);
        border-radius: 50%;
        color: var(--text);
        cursor: grab;
        user-select: none;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
        transition: background-color 160ms var(--ease);
      }

      .bubble:hover {
        background: var(--surface);
      }

      .bubble .count {
        position: absolute;
        right: 9px;
        bottom: 6px;
        font-size: 10.5px;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 10px;
        text-align: center;
        font-size: 11.5px;
        color: var(--ok);
        pointer-events: none;
        animation: panel-in 160ms var(--ease) both;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/phrases.tsx"></script>
  </body>
</html>
