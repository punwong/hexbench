name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 前端构建
        run: pnpm build

      # 原生格子的图标是从 lucide 生成的；升级 lucide 后忘了重跑，两边的形状
      # 就会悄悄分叉。这里重跑一遍，生成结果和工作区不一致就算失败。
      - name: 图标数据是最新的
        run: |
          node scripts/gen-icons.mjs
          git diff --exit-code -- crates/hexbench-fence/src/icons.rs

      - name: Rust 测试
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
