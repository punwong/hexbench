<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HexBench 便签</title>
    <style>
      /* 和呼出面板 / 设置窗口同一套颜色：便签是桌面上的一个小窗，不该另起一套。 */
      :root {
        --bg: #ffffff;
        --surface: #f7f7f8;
        --surface-2: #efeff1;
        --text: #0d0d0d;
        --muted: #6b6b6b;
        --line: rgba(0, 0, 0, 0.08);
        --accent: #2f6fed;
        --danger: #c62828;
        /* 便签自己的暖色：只用在标题栏圆点上，和桌面上的纸片对应。 */
        --note: #e0a52c;
        --ease: cubic-bezier(0.2, 0, 0, 1);
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        --bg: #0d0d0d;
        --surface: #191919;
        --surface-2: #232323;
        --text: #ececec;
        --muted: #9b9b9b;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #6ea0ff;
        --danger: #ff8a8a;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
      }

      #root {
        height: 100%;
      }

      .note {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        background: var(--bg);
        /* 圆角交给 DWM（和面板一样），这里只画一圈发丝边框。 */
        border: 1px solid #bcbcbc;
        overflow: hidden;
      }

      :root[data-theme="dark"] .note {
        border-color: rgba(255, 255, 255, 0.18);
      }

      /* ---------- 顶栏：拖动 + 工具 ---------- */

      .bar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        height: 36px;
        box-sizing: border-box;
        padding: 0 5px 0 11px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      /* 收起后整扇窗就只剩这一条：底边贴着窗框，别再画一条分割线。 */
      .note.rolled .bar {
        border-bottom: none;
      }

      .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--note);
      }

      .bar-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        flex: 0 0 auto;
        margin-right: 4px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .status.error {
        color: var(--danger);
      }

      .tool {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: default;
      }

      .tool:hover:not(:disabled) {
        background: var(--surface-2);
        color: var(--text);
      }

      .tool:disabled {
        opacity: 0.32;
      }

      /* 关闭是「拿掉桌面上的这张便签」，内容还在列表里：悬停才给一点警示色。 */
      .tool.close:hover:not(:disabled) {
        color: var(--danger);
      }

      /* ---------- 编辑 ---------- */

      .editor {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
      }

      .title-input {
        flex: 0 0 auto;
        margin: 12px 14px 0;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 17px;
        font-weight: 650;
        line-height: 1.4;
        outline: none;
        user-select: text;
      }

      .body-input {
        flex: 1 1 auto;
        min-height: 0;
        margin: 8px 14px 12px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.7;
        resize: none;
        outline: none;
        user-select: text;
        scrollbar-width: thin;
      }

      .body-input::placeholder,
      .title-input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }

      /* ---------- 预览 ---------- */

      .preview {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 15px 20px;
        box-sizing: border-box;
        user-select: text;
        scrollbar-width: thin;
        cursor: default;
      }

      .md {
        font-size: 13px;
        line-height: 1.72;
        word-break: break-word;
      }

      .md > :first-child {
        margin-top: 0;
      }

      .md h1,
      .md h2,
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        margin: 18px 0 8px;
        line-height: 1.35;
        font-weight: 650;
      }

      .md h1 {
        font-size: 19px;
      }

      .md h2 {
        font-size: 16.5px;
      }

      .md h3 {
        font-size: 14.5px;
      }

      .md h4,
      .md h5,
      .md h6 {
        font-size: 13px;
      }

      .md p,
      .md ul,
      .md ol,
      .md blockquote,
      .md pre,
      .md table {
        margin: 0 0 9px;
      }

      .md ul,
      .md ol {
        padding-left: 20px;
      }

      .md li + li {
        margin-top: 2px;
      }

      .md a {
        color: var(--accent);
        text-decoration: none;
      }

      .md a:hover {
        text-decoration: underline;
      }

      .md img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 10px 0;
        border-radius: 8px;
        background: var(--surface-2);
      }

      .md code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--surface-2);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 12px;
      }

      .md pre {
        overflow-x: auto;
        padding: 9px 11px;
        border-radius: 8px;
        background: var(--surface-2);
      }

      .md pre code {
        padding: 0;
        background: transparent;
      }

      .md blockquote {
        padding-left: 10px;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }

      .md hr {
        height: 1px;
        margin: 14px 0;
        border: none;
        background: var(--line);
      }

      .md table {
        border-collapse: collapse;
        font-size: 12.5px;
      }

      .md th,
      .md td {
        padding: 4px 8px;
        border: 1px solid var(--line);
      }

      .md input[type="checkbox"] {
        margin-right: 5px;
        vertical-align: -1px;
      }

      .empty {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 20px;
        color: var(--muted);
        font-size: 12.5px;
        text-align: center;
      }

      .empty button {
        margin-top: 4px;
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: default;
      }

      .empty button:hover {
        background: var(--surface-2);
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.28);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      :root[data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      :root[data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/note.tsx"></script>
  </body>
</html>
