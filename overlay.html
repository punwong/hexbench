<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HexBench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #root {
        position: fixed;
        inset: 0;
      }

      /* 触发带：蓝底 + 内描边。7% 的黑在深色壁纸上等于没画，内描边
         还能把「从哪一条线开始算」标出来（上下的带都对得上）。 */
      .band {
        position: absolute;
        background: rgba(37, 99, 235, 0.14);
        box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.78);
        animation: zone-in 160ms cubic-bezier(0.2, 0, 0, 1);
      }

      /* 预览倒计时：贴在带子里，深底白字，壁纸再花也看得清。 */
      .band-tip {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(13, 13, 13, 0.78);
        color: #fff;
        font: 500 11.5px/1 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }

      .band-tip span {
        opacity: 0.72;
      }

      .band-tip strong {
        font-weight: 600;
      }

      .zone {
        position: absolute;
        border-radius: 3px;
        background: rgba(37, 99, 235, 0.28);
        border: 1px solid rgba(37, 99, 235, 0.85);
        box-shadow: none;
        animation: zone-in 160ms cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes zone-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
