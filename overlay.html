<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HexBench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #root {
        position: fixed;
        inset: 0;
      }

      .band {
        position: absolute;
        background: rgba(13, 13, 13, 0.07);
        border-top: 1px dashed rgba(13, 13, 13, 0.45);
        animation: zone-in 160ms cubic-bezier(0.2, 0, 0, 1);
      }

      .zone {
        position: absolute;
        border-radius: 3px;
        background: rgba(13, 13, 13, 0.3);
        border: 1px solid rgba(13, 13, 13, 0.75);
        box-shadow: none;
        animation: zone-in 160ms cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes zone-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
