<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>快速呼出</title>
    <style>
      /* 颜色和主设置窗口保持同一套：侧边栏浅灰、内容白底、1px 发丝边框 */
      :root {
        --bg: #ffffff;
        --sidebar: #f7f7f8;
        --surface: #f7f7f8;
        --surface-2: #efeff1;
        --text: #0d0d0d;
        --muted: #6b6b6b;
        --line: rgba(0, 0, 0, 0.08);
        --pick: rgba(0, 0, 0, 0.1);
        --marquee-line: rgba(0, 0, 0, 0.3);
        --marquee-fill: rgba(0, 0, 0, 0.05);
        --ease: cubic-bezier(0.2, 0, 0, 1);
        /* 滑块、列表这类「有惯性」的移动：起手快、收尾软，不弹过头。 */
        --glide: cubic-bezier(0.25, 0.9, 0.3, 1);
      }

      :root[data-theme="dark"] {
        --bg: #0d0d0d;
        --sidebar: #131313;
        --surface: #191919;
        --surface-2: #232323;
        --text: #ececec;
        --muted: #9b9b9b;
        --line: rgba(255, 255, 255, 0.1);
        --pick: rgba(255, 255, 255, 0.14);
        --marquee-line: rgba(255, 255, 255, 0.35);
        --marquee-fill: rgba(255, 255, 255, 0.07);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
      }

      #root {
        height: 100%;
      }

      .palette {
        display: flex;
        height: 100%;
        box-sizing: border-box;
        background: var(--bg);
        /* 外框用一个固定的浅灰（#bcbcbc）：和右侧网页面板接缝处实测的
        渲染值完全一致，两个面板的边框看起来才是同一根线。 */
        border: 1px solid #bcbcbc;
        /* 圆角交给窗口自己（后端对面板调了 DWMWCP_ROUND，和设置窗口同一个 8px），
        这里不再自己画：自绘的圆角外面那圈三角 WebView 会补成白色，深色主题下
        四个角就是白点；两条弧线也不会完全重合，描边在拐角处会被系统剪掉一截。
        Win10 没有这个属性，面板就是直角——和设置窗口一样，不做逐像素对齐。 */
        overflow: hidden;
      }

      /* 入场在 launcher.tsx 里用 Web Animations 播（只淡入、不缩放）：
      面板贴着屏幕边缘，缩放会在边上露出一圈窗口背景的缝；而且窗口是常驻的，
      CSS 动画只在页面加载时跑一次，每次呼出都要重播才行。 */

      /* 换分类：新内容淡入 + 轻轻上移一点。用 CSS 而不是 View Transitions：
      侧边栏是悬停即预览的，每次切换都会截图冻结整个面板 150ms，
      鼠标划过几行就会一顿一顿的。 */
      .grid.view-in,
      .list.view-in {
        animation: view-in 200ms var(--ease) both;
      }

      @keyframes view-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      /* 滚动条：细一点、淡一点，别喧宾夺主 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.28);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      :root[data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      :root[data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      /* ---------- 侧边栏：从顶上一直到下，和设置窗口一致 ---------- */

      .sidebar {
        flex: 0 0 158px;
        width: 158px;
        box-sizing: border-box;
        padding: 14px 9px;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        scrollbar-width: thin;
        /* 选中高亮是里面那块绝对定位的滑块，靠它定位。 */
        position: relative;
      }

      /* 选中高亮：整块只有它一个形状，切换时滑过去，而不是两行各自变色。 */
      .side-hl {
        position: absolute;
        left: 9px;
        right: 9px;
        top: 0;
        height: 0;
        border-radius: 9px;
        background: var(--surface-2);
        pointer-events: none;
        z-index: 0;
        will-change: transform, height;
        transition:
          transform 240ms var(--glide),
          height 240ms var(--glide),
          opacity 140ms ease;
      }

      /* 第一帧不要从顶上滑下来。 */
      .side-hl.still {
        transition: none;
      }

      .side-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        margin-bottom: 3px;
        padding: 9px 11px;
        border: none;
        border-radius: 9px;
        background: transparent;
        transition: background 120ms ease, color 120ms ease;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: default;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        z-index: 1;
      }

      .side-item span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 悬停立刻给反馈，切换内容可以稍慢，避免"高亮跟不上鼠标" */
      .side-item:hover {
        background: var(--surface-2, rgba(0, 0, 0, 0.05));
      }

      /* 底色由滑块给，这里只加粗——两行同时有底色就成了「亮错行」。 */
      .side-item.active {
        background: transparent;
        font-weight: 600;
      }

      .side-item .count {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }

      .side-sep {
        height: 1px;
        margin: 10px 11px;
        background: var(--line);
      }

      .side-hint {
        padding: 6px 9px;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.6;
      }

      /* ---------- 右侧：搜索 + 网格 + 底部说明 ---------- */

      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* 搜索框挪到工具条最右侧，做成一个小输入框 */
      .search {
        flex: 0 0 auto;
        width: 210px;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 9px;
        border-radius: 8px;
        background: var(--surface-2);
      }

      .search:focus-within {
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .search svg {
        flex: 0 0 auto;
        color: var(--muted);
      }

      .search input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        user-select: text;
        cursor: text;
      }

      .search input::placeholder {
        color: var(--muted);
      }

      /* ---------- 工具条：前进 / 后退 / 上一级 / 面包屑 / 排序 ---------- */

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 40px;
        box-sizing: border-box;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
      }

      .tool-btn {
        flex: 0 0 auto;
        min-width: 26px;
        height: 24px;
        padding: 0 6px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        cursor: default;
      }

      .tool-btn:hover:not(:disabled) {
        background: var(--surface-2);
      }

      .tool-btn:disabled {
        opacity: 0.3;
      }

      .sort-select {
        flex: 0 0 auto;
        height: 24px;
        padding: 0 3px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: default;
      }

      .crumbs {
        flex: 1 1 auto;
        min-width: 40px;
        display: flex;
        align-items: center;
        gap: 1px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .crumb {
        padding: 2px 7px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
        cursor: default;
      }

      .crumb:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .crumb-sep {
        color: var(--muted);
        opacity: 0.55;
        font-size: 12px;
      }


      .crumb-action {
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
        cursor: default;
      }

      .crumb-action:hover {
        background: var(--surface-2);
      }
      /* 拖拽悬停在文件夹上：给一圈明显的描边 */
      .tile.drop-hover,
      .row.drop-hover {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 2px var(--text);
      }
      /* 面包屑同理：拖到哪一段上，松手就移进那一层。 */
      .crumb.drop-hover {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 2px var(--text);
        color: var(--text);
      }
      /* 一闪而过的提示条 */
      .toast {
        position: absolute;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        z-index: 30;
        max-width: 70%;
        padding: 8px 14px;
        border-radius: 9px;
        background: rgba(32, 32, 34, 0.94);
        color: #fff;
        font-size: 12.5px;
        line-height: 1.45;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        pointer-events: none;
      }
      /* ---------- 排序菜单 + 列表视图 ---------- */

      .tool-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tool-btn.on {
        background: var(--surface-2);
      }

      .sort-wrap {
        position: relative;
        flex: 0 0 auto;
      }

      .sort-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 20;
        min-width: 120px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.14);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .sort-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 9px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        cursor: default;
      }

      .sort-item:hover {
        background: var(--surface-2);
      }

      .sort-item.active {
        font-weight: 600;
      }

      /* 虚拟滚动：容器只负责滚动，条目按绝对位置摆；总高度由 .virt-space 撑。 */
      .list {
        position: relative;
        flex: 1;
        overflow-y: auto;
        padding: 0;
        scrollbar-width: thin;
      }

      .virt-space {
        width: 100%;
        pointer-events: none;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 11px;
        border-radius: 7px;
        cursor: default;
        outline: none;
        box-sizing: border-box;
        transition: background 130ms var(--ease), transform 130ms var(--ease);
      }

      .row:active {
        transform: scale(0.99);
      }

      .row.active {
        background: var(--surface-2);
      }

      .row.picked {
        background: var(--pick);
      }

      .row .tile-icon {
        width: 22px;
        height: 22px;
      }

      .row .tile-icon img {
        width: 22px;
        height: 22px;
        /* 缩略图保持原图比例（资源管理器就是这样），不要拉成方图。 */
        object-fit: contain;
      }

      .row .tile-glyph {
        font-size: 15px;
      }

      .row .tile-name {
        flex: 1 1 auto;
        min-width: 0;
        display: block;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
      }

      .row .tile-input {
        text-align: left;
        max-width: none;
      }

      .row-meta {
        flex: 0 0 auto;
        min-width: 62px;
        text-align: right;
        color: var(--muted);
        font-size: 11.5px;
      }

      .row-meta.date {
        min-width: 96px;
      }
      .grid {
        position: relative;
        flex: 1;
        overflow-y: auto;
        padding: 0;
        scrollbar-width: thin;
      }

      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 4px 8px;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        border-radius: 10px;
        cursor: default;
        outline: none;
        /* 虚拟滚动给的是固定格子尺寸：宽度和高度都在内联样式里。 */
        box-sizing: border-box;
        overflow: hidden;
        transition: background 130ms var(--ease), transform 130ms var(--ease);
      }

      .tile:active {
        transform: scale(0.985);
      }

      .tile.active {
        background: var(--surface-2);
      }

      /* 真正被选中的格子：比悬停更深一点，多选时一眼能数出来 */
      .tile.picked {
        background: var(--pick);
      }

      .tile.picked.active {
        background: var(--pick);
      }

      .marquee {
        position: absolute;
        z-index: 1;
        border: 1px solid var(--marquee-line);
        background: var(--marquee-fill);
        border-radius: 2px;
        pointer-events: none;
      }

      .tile-icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
      }

      .tile-icon img {
        width: 48px;
        height: 48px;
        /* 同上：非方图按比例缩放在 48×48 的框里，四周留白。 */
        object-fit: contain;
        /* 图还没到之前不占位（下面有字形兜底）；解码完成才淡进来，
        这样一屏图标是一张一张浮现的，而不是同时「啪」地跳出来。 */
        opacity: 0;
        transform: scale(0.9);
        transition:
          opacity 140ms var(--ease),
          transform 180ms var(--ease);
      }

      .tile-icon img.ready {
        opacity: 1;
        transform: none;
      }

      .tile-glyph {
        font-size: 26px;
        line-height: 1;
        color: var(--muted);
      }

      .tile-name {
        max-width: 100%;
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-all;
      }

      .tile-input {
        width: 100%;
        max-width: 100px;
        padding: 3px 5px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 11.5px;
        line-height: 1.35;
        text-align: center;
        resize: none;
        overflow-y: auto;
        outline: none;
        user-select: text;
        scrollbar-width: thin;
      }

      .empty {
        position: absolute;
        inset: 0;
        margin: auto;
        padding: 24px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.9;
        pointer-events: none;
      }

      .empty button {
        pointer-events: auto;
      }

      .empty strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }

      .empty-action {
        display: block;
        width: fit-content;
        margin: 14px auto 0;
        padding: 7px 16px;
        /* 外框用一个固定的浅灰（#bcbcbc）：和右侧网页面板接缝处实测的
        渲染值完全一致，两个面板的边框看起来才是同一根线。 */
        border: 1px solid #bcbcbc;
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
      }

      .empty-action:hover {
        opacity: 0.88;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
      }

      kbd {
        font: inherit;
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--surface-2);
        color: var(--text);
      }
      /* 侧边栏右键菜单 */
  .ctx-menu {
    /* 相对窗口定位，和右键时的 clientX/clientY 同一个坐标系。放在侧边栏
       （relative + 可滚动）里面用 absolute 的话，菜单会跟着滚动位置上下偏，
       贴着底边时还会被滚出可视区。 */
    position: fixed;
    z-index: 40;
    min-width: 132px;
    padding: 5px;
    border: 1px solid var(--line, #e3e3e3);
    border-radius: 9px;
    background: var(--surface, #fff);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
  }

  .ctx-menu button {
    display: block;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
  }

  .ctx-menu button:hover {
    background: var(--hover, rgba(0, 0, 0, 0.06));
  }

  .side-input-row {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }

  .side-ok {
    flex: 0 0 auto;
    width: 28px;
    border: 1px solid var(--accent, #2f6fed);
    border-radius: 7px;
    background: var(--accent, #2f6fed);
    color: #fff;
    cursor: pointer;
  }

  .side-input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid var(--accent, #2f6fed);
    border-radius: 7px;
    background: var(--surface, #fff);
    color: inherit;
    font-size: 12.5px;
  }
  /* 网站图标标签页 */
  .site-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 4px;
  }

  .site-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.04);
    cursor: pointer;
    overflow: hidden;
  }

  .site-tab img {
    width: 18px;
    height: 18px;
    object-fit: contain;
  }

  .site-tab span {
    font-size: 12px;
    color: var(--muted, #888);
  }

  .site-tab:hover {
    border-color: var(--line, #e3e3e3);
  }

  .site-tab.active {
    border-color: var(--accent, #2f6fed);
    box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.15);
  }
      /* 右侧网页区：和文件区并排，多出来的一栏 */
      .web-col {
        display: none;
        flex: 0 0 420px;
        width: 420px;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--bg);
      }

      body.web-open .web-col { display: flex; }

      .web-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 40px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
      }

      .web-tab {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }

      .web-tab img {
        width: 16px;
        height: 16px;
        object-fit: contain;
      }

      .web-tab span {
        font-size: 11px;
        color: var(--muted);
      }

      .web-tab:hover { background: var(--pick); }

      .web-tab.active {
        border-color: #2f6fed;
        background: rgba(47, 111, 237, 0.1);
      }

      /* 小控件统一给一点过渡：悬停、按下不再是「瞬间换色」，而是 120ms。
      统一在这里写，免得每个按钮各写一份、时长还不一样。 */
      .tool-btn,
      .crumb,
      .empty-action,
      .sort-item,
      .ctx-menu button,
      .site-tab,
      .web-tab {
        transition:
          background 120ms ease,
          color 120ms ease,
          border-color 120ms ease,
          opacity 120ms ease;
      }

      /* 用户在系统里关掉动画时，这些全都不做。 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          transition-duration: 1ms !important;
        }
      }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/launcher.tsx"></script>
  </body>
</html>
